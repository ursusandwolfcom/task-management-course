name: Course API checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      JWT_SIGNING_KEY_BASE64: dGVzdC1vbmx5LWtleS1mb3ItczA0LW5vdC1mb3ItcHJvZHVjdGlvbg==
      DROPBOX_ACCESS_TOKEN: disposable-ci-token
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: course_ci
          POSTGRES_USER: course
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U course -d course_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: H2 tests, Checkstyle and coverage
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: PostgreSQL tests, Checkstyle and coverage
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/course_ci
          TEST_DATABASE_USERNAME: course
          TEST_DATABASE_PASSWORD: disposable-ci-password
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Packaged startup and restart
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/course_ci
          SPRING_DATASOURCE_USERNAME: course
          SPRING_DATASOURCE_PASSWORD: disposable-ci-password
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            java -Duser.timezone=UTC -jar target/task-management-app-0.0.1-SNAPSHOT.jar --server.port=18080 > "target/startup-$attempt.log" 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            healthy=false
            for check in $(seq 1 60); do
              if curl -fs http://127.0.0.1:18080/actuator/health | jq -e '.status == "UP"'; then
                healthy=true
                break
              fi
              kill -0 "$app_pid" || { cat "target/startup-$attempt.log"; exit 1; }
              sleep 1
            done
            test "$healthy" = true
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/users/me)" = 401
            curl -fs http://127.0.0.1:18080/v3/api-docs | jq -e '.paths["/api/tasks"] != null'
            kill "$app_pid"
            wait "$app_pid" || true
            trap - EXIT
          done
      - name: Build and smoke the Docker application
        run: |
          set -euo pipefail
          course_env="$RUNNER_TEMP/course.env"
          cat > "$course_env" <<EOF
          POSTGRES_DB=course_container
          POSTGRES_USER=course
          POSTGRES_PASSWORD=disposable-container-password
          POSTGRES_PORT=15433
          APP_PORT=18081
          JWT_SIGNING_KEY_BASE64=$JWT_SIGNING_KEY_BASE64
          DROPBOX_ACCESS_TOKEN=disposable-ci-token
          EOF
          docker compose --env-file "$course_env" up --build -d
          trap 'docker compose --env-file "$course_env" logs; docker compose --env-file "$course_env" down -v' EXIT
          for attempt in 1 2; do
            healthy=false
            for check in $(seq 1 90); do
              if curl -fs http://127.0.0.1:18081/actuator/health | jq -e '.status == "UP"'; then
                healthy=true
                break
              fi
              sleep 1
            done
            test "$healthy" = true
            curl -fs http://127.0.0.1:18081/v3/api-docs | jq -e '.paths["/api/tasks"] != null'
            migration_count=$(docker compose --env-file "$course_env" exec -T postgres psql -U course -d course_container -tAc 'select count(*) from public.databasechangelog')
            test "$migration_count" = 1
            if [ "$attempt" = 1 ]; then
              docker compose --env-file "$course_env" restart app
            fi
          done
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-verification
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/startup-*.log
