spring.application.name=task-management-app
spring.config.import=optional:file:.env.course[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.context-path=/api
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:task_management_course}
spring.datasource.username=${POSTGRES_USER:task_management}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
spring.mvc.problemdetails.enabled=true
jwt.key-base64=${JWT_SIGNING_KEY_BASE64}
dropbox.access-token=${DROPBOX_ACCESS_TOKEN}
dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:}
dropbox.app-key=${DROPBOX_APP_KEY:}
dropbox.app-secret=${DROPBOX_APP_SECRET:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.from=${MAIL_FROM:tasks@example.test}
notification.reminder-cron=0 0 9 * * *
